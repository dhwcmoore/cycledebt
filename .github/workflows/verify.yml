name: Verify finite regional residue obstruction

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python files
        run: python -m py_compile $(find . -name "*.py")

      - name: Run base classifier examples
        run: python residue_test.py

      - name: Run actual object classification
        run: python residue_test.py actual/actual_gluing_object_v1.json

      - name: Run presentation invariance tests
        run: python invariance_test.py actual/actual_gluing_object_v1.json

      - name: Run refinement persistence tests
        run: python refinement_invariance_test.py actual/actual_gluing_object_v1.json

      - name: Run property-based regression tests
        run: python property_based_test.py
